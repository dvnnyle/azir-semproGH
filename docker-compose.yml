# Krisis - lokal utviklingsstack (app + mysql)
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=krisisdb;User=root;Password=${MYSQL_ROOT_PASSWORD:-123};"
    depends_on:
      db:
      
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: krisisdb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Filnavnene her styrer rekkefølgen MySQL kjorer dem i (alfabetisk) - users må
      # opprettes for submissions, siden Submissions har en FOREIGN KEY mot Users.
      - ./Data/sql/users.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
      - ./Data/sql/submissions.sql:/docker-entrypoint-initdb.d/02-submissions.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
