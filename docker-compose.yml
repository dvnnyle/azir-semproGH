# Krisis - lokal utviklingsstack (app + mysql) maria docker asp 
name: krisis
services:
  app:
    build: .
    container_name: krisis-app
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=krisisdb;User=krisisapp;Password=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in your environment};"
    depends_on:
      db:
      
        condition: service_healthy

  db:
    image: mariadb:11
    container_name: krisis-db
    environment:
      MYSQL_DATABASE: krisisdb
      MYSQL_USER: krisisapp
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in your environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment}
    ports:
      # 3307 på verten, ikke 3306 - en nativt installert MySQL (mysqld) kjorer
      # allerede på 3306 lokalt, og kolliderte med denne containeren.
      # Containeren bruker fortsatt 3306 INNI seg selv/Docker-nettverket (se
      # "Server=db;Port=3306" over - urort, siden det er container-til-
      # container og ikke pavirkes av dette).
      # du kan jobbe eller bruke heidi mysql gui hvis localt sjekk port
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Init scripts run in order; Identity precedes the submission owner foreign key.
      - ./Data/sql/identity.sql:/docker-entrypoint-initdb.d/00-identity.sql:ro
      - ./Data/sql/roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ./Data/sql/categories.sql:/docker-entrypoint-initdb.d/02-categories.sql:ro
      - ./Data/sql/users.sql:/docker-entrypoint-initdb.d/03-users.sql:ro
      - ./Data/sql/submissions.sql:/docker-entrypoint-initdb.d/04-submissions.sql:ro
      - ./Data/sql/submission-identity-owner.sql:/docker-entrypoint-initdb.d/05-submission-identity-owner.sql:ro
      - ./Data/sql/resource-drafts.sql:/docker-entrypoint-initdb.d/06-resource-drafts.sql:ro
      - ./Data/sql/requests.sql:/docker-entrypoint-initdb.d/07-requests.sql:ro
      - ./Data/sql/points.sql:/docker-entrypoint-initdb.d/08-points.sql:ro
      - ./Data/sql/eksempeldata.sql:/docker-entrypoint-initdb.d/09-eksempeldata.sql:ro
      - ./Data/sql/restrict-app-user.sql:/docker-entrypoint-initdb.d/10-restrict-app-user.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
