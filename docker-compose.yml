# Krisis - lokal utviklingsstack (app + mysql)
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=krisisdb;User=root;Password=${MYSQL_ROOT_PASSWORD:-123};"
    depends_on:
      db:
      
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: krisisdb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
    ports:
      # 3307 pa verten, ikke 3306 - en nativt installert MySQL (mysqld) kjorer
      # allerede pa 3306 lokalt, og kolliderte med denne containeren.
      # Containeren bruker fortsatt 3306 INNI seg selv/Docker-nettverket (se
      # "Server=db;Port=3306" over - urort, siden det er container-til-
      # container og ikke pavirkes av dette).
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Filnavnene her styrer rekkefølgen MySQL kjorer dem i (alfabetisk) - roles og
      # categories før users/submissions (FK), points sist (FK mot submissions).
      - ./Data/sql/roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./Data/sql/categories.sql:/docker-entrypoint-initdb.d/01-categories.sql:ro
      - ./Data/sql/users.sql:/docker-entrypoint-initdb.d/02-users.sql:ro
      - ./Data/sql/submissions.sql:/docker-entrypoint-initdb.d/03-submissions.sql:ro
      - ./Data/sql/points.sql:/docker-entrypoint-initdb.d/04-points.sql:ro
      - ./Data/sql/eksempeldata.sql:/docker-entrypoint-initdb.d/05-eksempeldata.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
